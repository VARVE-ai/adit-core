name: Deploy production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact stable version, for example 1.1.5'
        required: true
        type: string
      notes:
        description: 'User-facing changes and any upgrade instructions'
        required: true
        type: string
      dry_run:
        description: 'Rehearse build, packaging and installation without publishing'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

# Never cancel a publish halfway through. Serialize all release versions.
concurrency:
  group: production-release
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_NOTES: ${{ inputs.notes }}
  DRY_RUN: ${{ inputs.dry_run }}

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the production source branch
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$RELEASE_REF" != refs/heads/main ] || [ "$RELEASE_REPOSITORY" != VARVE-ai/adit-core ]; then
            echo 'Production releases and rehearsals must run from VARVE-ai/adit-core main.' >&2
            exit 1
          fi

  prepare:
    needs: source
    if: github.ref == 'refs/heads/main' && github.repository == 'VARVE-ai/adit-core'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Validate version and source
        run: node scripts/release.mjs validate
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Pack once and inspect package contents
        run: node scripts/release.mjs pack
      - name: Preserve source tag and exact archives in a draft release
        if: inputs.dry_run == false
        run: node scripts/release.mjs stage
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            .cache/release/*.tgz
            .cache/release/release-manifest.json
          if-no-files-found: error
          retention-days: 7

  install:
    needs: prepare
    name: Install on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: .cache/release
      - run: node scripts/release-smoke.mjs

  publish:
    needs: [prepare, install]
    if: inputs.dry_run == false
    runs-on: ubuntu-latest
    # Four packages may each need five minutes before npm exposes them.
    timeout-minutes: 35
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # npm 11.21+ supports trusted publishing AND distribution-tag updates.
      - run: npm install --global npm@11.21.1
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: .cache/release
      - name: Publish or verify the four exact archives
        run: node scripts/release.mjs publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Install the uploaded version from npm
        run: node scripts/release-smoke.mjs .cache/release registry
      - name: Promote default versions and publish release notes
        run: node scripts/release.mjs finish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
