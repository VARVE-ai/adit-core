packages:
  - "packages/*"
allowBuilds:
  better-sqlite3: false
  esbuild: true
onlyBuiltDependencies:
  - esbuild
# better-sqlite3 v13 ships prebuilt binaries inside the npm package; its
# binding.gyp exists only as a fallback for unsupported platforms and must
# not run on install (it requires a native toolchain).
neverBuiltDependencies:
  - better-sqlite3
# Shields uses bundled font data; defer the dependency's unused Node file loaders
# so importing badge-maker in the browser does not call util.promisify.
patchedDependencies:
  char-width-table-consumer@1.0.0: patches/char-width-table-consumer@1.0.0.patch
